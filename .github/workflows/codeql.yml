# CodeQL code scanning for the C# sources. build-mode none reads the sources directly, so no Windows build is needed.
# Actions are pinned to full commit SHAs (Dependabot keeps them current).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning needs a public repository (or GitHub Advanced Security). While the repository is private this job is
    # skipped instead of failing, and it starts working by itself once the repository is made public.
    # Scheduled runs have no event payload (github.event.repository is empty there), so they ask the API in the first step.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Repository visibility (scheduled runs)
        id: repo
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.repo.outputs.private != 'true' }}
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ steps.repo.outputs.private != 'true' }}
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ steps.repo.outputs.private != 'true' }}
        with:
          category: /language:csharp
